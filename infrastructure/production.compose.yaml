# Private services only. Supply a reviewed HTTPS ingress and external secrets.
services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/api.Dockerfile
    env_file: ${FLEETPILOT_API_ENV:?Set path to private production API env file}
    environment:
      ENVIRONMENT: production
      STORAGE_BACKEND: s3
      RATE_LIMIT_BACKEND: postgres
      MIGRATION_DATABASE_URL: ""
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=20)"]
      interval: 30s
      timeout: 25s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: infrastructure/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proxy:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, web]
